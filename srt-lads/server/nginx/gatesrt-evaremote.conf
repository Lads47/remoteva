map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream srtlads_backend {
    server 127.0.0.1:3000 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    listen [::]:80;
    server_name gatesrt.evaremote.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gatesrt.evaremote.com;

    ssl_certificate     /etc/letsencrypt/live/gatesrt.evaremote.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gatesrt.evaremote.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    root /var/www/srtlads-placeholder;
    index index.html;

    # Netdata monitoring - protected by basic auth
    location /netdata/ {
        auth_basic "SRT LADS Netdata";
        auth_basic_user_file /etc/nginx/.htpasswd_netdata;

        proxy_pass http://127.0.0.1:19999/;
        proxy_http_version 1.1;
        proxy_pass_request_headers on;
        proxy_set_header Connection "keep-alive";
        proxy_store off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        gzip on;
        gzip_proxied any;
        gzip_types *;
    }

    location / {
        proxy_pass http://srtlads_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @placeholder;
    }

    location @placeholder {
        root /var/www/srtlads-placeholder;
        try_files /index.html =503;
    }
}
