<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SRT LADS — Dashboard</title>
  <link rel="stylesheet" href="/css/login.css">
  <style>
    .placeholder {
      max-width: 640px;
      text-align: left;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 28px 32px;
      margin-top: 16px;
    }
    .placeholder h3 { margin-top: 0; }
    .placeholder ul { margin: 0; padding-left: 20px; line-height: 1.7; color: var(--text-dim); }
    .logout-bar {
      position: absolute;
      top: 20px;
      right: 24px;
    }
    .btn-secondary {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-secondary:hover { color: var(--text); border-color: var(--text-dim); }
  </style>
</head>
<body>
  <form class="logout-bar" method="POST" action="/auth/logout">
    <button class="btn-secondary" type="submit">Se déconnecter</button>
  </form>

  <div class="brand">
    <h1>SRT LADS</h1>
    <p>Dashboard</p>
  </div>

  <div class="placeholder">
    <h3>Phase 2.1 — Backend OK ✓</h3>
    <p>Cette page est un placeholder. L'interface complète arrive en Phase 2.3.</p>
    <ul>
      <li><strong>Phase 2.2</strong> — API REST gestion des projets</li>
      <li><strong>Phase 2.3</strong> — Frontend complet (dashboard, projets, édition)</li>
      <li><strong>Phase 2.4</strong> — Monitoring live + génération PDF</li>
    </ul>
  </div>

  <div class="footer">v0.2.0 · Phase 2.1</div>
</body>
</html>
