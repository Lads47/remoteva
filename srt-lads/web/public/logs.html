<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SRT LADS — Logs</title>
  <link rel="stylesheet" href="/css/common.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>SRT LADS</h1>
      <span class="crumb"><a href="/dashboard">Dashboard</a> &rsaquo; Logs</span>
    </div>
    <nav>
      <a href="/dashboard">Dashboard</a>
      <a href="/projects">Projets</a>
      <a href="/live">Vue Live</a>
      <a href="/system">Système</a>
      <a href="/logs" class="active">Logs</a>
    </nav>
    <div class="user-zone">
      <button class="btn btn-sm" id="btn-logout">Déconnexion</button>
    </div>
  </header>

  <main class="app-main">
    <div class="page-head">
      <h2>Événements</h2>
      <div class="actions">
        <a class="btn btn-sm" id="dl-csv">⤓ Exporter CSV</a>
        <button class="btn btn-sm" id="btn-refresh">↻ Rafraîchir</button>
      </div>
    </div>

    <div class="card filters">
      <div class="filter-tabs" id="filter-tabs">
        <button data-type=""             class="filter-tab active">Tous</button>
        <button data-type="connect"      class="filter-tab">Connexions</button>
        <button data-type="disconnect"   class="filter-tab">Déconnexions</button>
        <button data-type="service-restart" class="filter-tab">Restart</button>
      </div>
      <input type="search" id="search" placeholder="Rechercher…" class="search-input">
    </div>

    <div id="logs-list">
      <p class="muted">Chargement…</p>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/logs.js"></script>
</body>
</html>
